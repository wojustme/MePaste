name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Verify tag matches app version
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$app_version" != "$tag_version" ]]; then
            echo "Tag version ($tag_version) must match CFBundleShortVersionString ($app_version)." >&2
            exit 1
          fi

      - name: Build release assets
        run: ./scripts/prepare-release.sh "${GITHUB_REF_NAME#v}"

      - name: Prepare release notes
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          release_notes_path="build/release-notes.md"

          if [[ -f "$notes_path" ]]; then
            cp "$notes_path" "$release_notes_path"
          else
            printf '## %s\n\nSee the generated changelog for this release.\n' "$GITHUB_REF_NAME" > "$release_notes_path"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/release-notes.md
          generate_release_notes: true
          files: |
            build/release/*
