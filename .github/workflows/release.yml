name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          app_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$app_version" != "$tag_version" ]]; then
            echo "Tag version ($tag_version) must match CFBundleShortVersionString ($app_version)." >&2
            exit 1
          fi

      - name: Build release assets
        run: ./scripts/prepare-release.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/release/*
